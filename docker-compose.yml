services:
  dev:
    image: debian:bookworm-slim
    container_name: dev
    hostname: dev
    ports:
      - "0.0.0.0:3000:3000"
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.claude:/root/.claude
    environment:
      - BT_ALLOWED_HOSTS=host.docker.internal
      # Root shell on 0.0.0.0: set BT_TOKEN in the host env (same value for both, the grid forwards it).
      - BT_TOKEN=${BT_TOKEN:-}
      - BT_VIEW_TOKEN=${BT_VIEW_TOKEN:-}
    command: ["/bin/bash", "/scripts/main.sh"]
    restart: unless-stopped

  kali:
    image: kalilinux/kali-rolling
    container_name: kali
    hostname: kali
    ports:
      - "0.0.0.0:3001:3000"
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.claude:/root/.claude
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - BT_ALLOWED_HOSTS=host.docker.internal
      # Root shell on 0.0.0.0: set BT_TOKEN in the host env (same value for both, the grid forwards it).
      - BT_TOKEN=${BT_TOKEN:-}
      - BT_VIEW_TOKEN=${BT_VIEW_TOKEN:-}
      - BT_FRAME_ANCESTORS=* http://localhost:3000 http://host.docker.internal:3000
    command: ["/bin/bash", "/scripts/main.sh"]
    restart: unless-stopped
