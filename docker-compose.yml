services:
  dev:
    image: debian:bookworm-slim
    container_name: dev
    hostname: dev
    ports:
      - "3000:3000"
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["/bin/bash", "/scripts/main.sh"]
    restart: unless-stopped

  kali:
    image: kalilinux/kali-rolling
    container_name: kali
    hostname: kali
    ports:
      - "3001:3000"
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - BT_FRAME_ANCESTORS=*
    command: ["/bin/bash", "/scripts/main.sh"]
    restart: unless-stopped
