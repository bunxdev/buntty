services:
  dev:
    # kalilinux/kali-rolling preferred for security agents (Red/Blue/Purple Team)
    image: kalilinux/kali-rolling
    container_name: dev
    hostname: dev
    ports:
      - "3000:3000"
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    command: ["/bin/bash", "/scripts/main.sh"]
    restart: unless-stopped
