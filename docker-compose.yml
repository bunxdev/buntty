services:
  dev:
    image: debian:bookworm-slim
    container_name: dev
    hostname: dev
    ports:
      # Loopback only: the UI is a root shell. Set BT_BIND=0.0.0.0 (plus BT_TOKEN) to expose it.
      - "${BT_BIND:-127.0.0.1}:3000:3000"
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.claude:/root/.claude
    command: ["/bin/bash", "/scripts/main.sh"]
    restart: unless-stopped

  kali:
    image: kalilinux/kali-rolling
    container_name: kali
    hostname: kali
    ports:
      - "${BT_BIND:-127.0.0.1}:3001:3000"
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.claude:/root/.claude
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      # Only the grid on :3000 may frame this terminal (was "*": clickjackable from any site).
      - BT_FRAME_ANCESTORS='self' http://localhost:3000 http://127.0.0.1:3000
    command: ["/bin/bash", "/scripts/main.sh"]
    restart: unless-stopped
