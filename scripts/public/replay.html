<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BunTTY Replay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/asciinema-player@3.7.1/dist/bundle/asciinema-player.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0a0a0a; color: #e0e0e0; font-family: monospace; }
    .header {
      height: 40px; background: #111122; display: flex; align-items: center;
      padding: 0 16px; gap: 12px; border-bottom: 1px solid #2a2a3e;
    }
    .header .brand { color: #e74c3c; font-weight: bold; font-size: 13px; }
    .header .sep { color: #333; }
    .header .title { color: #888; font-size: 12px; }
    .header .session { color: #3498db; font-size: 12px; font-weight: bold; }
    .header .actions { margin-left: auto; display: flex; gap: 8px; }
    .header .btn {
      padding: 4px 12px; font-size: 11px; cursor: pointer; border-radius: 4px;
      border: 1px solid #333; background: #1a1a2e; color: #aaa; font-family: monospace;
      text-decoration: none; display: inline-block;
    }
    .header .btn:hover { background: #2a2a3e; color: #fff; border-color: #555; }
    .header .btn[hidden] { display: none; }
    .header .btn:focus-visible { outline: 2px solid #3498db; outline-offset: 1px; }
    #player-container {
      width: 100%; height: calc(100dvh - 40px); padding: 20px; overflow: auto;
      display: flex; justify-content: center; align-items: center;
    }
    #player-container .ap-wrapper { width: 100% !important; max-width: 960px; height: 100% !important; }
    .no-session {
      text-align: center; color: #8a8aa0; font-size: 14px; line-height: 1.6; padding: 16px;
    }
    .no-session code { color: #3498db; background: #1a1a2e; padding: 2px 8px; border-radius: 3px; }
    @media (max-width: 600px) {
      .header { padding: 0 8px; gap: 8px; }
      .header .sep, .header .title { display: none; }
      #player-container { padding: 8px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <span class="brand">BunTTY</span>
    <span class="sep" aria-hidden="true">|</span>
    <span class="title">Replay</span>
    <span class="session" id="sessionLabel"></span>
    <nav class="actions">
      <a class="btn" id="downloadBtn" title="Descargar archivo .cast" download>Descargar .cast</a>
      <a class="btn" href="/" id="backBtn">Volver al terminal</a>
    </nav>
  </header>
  <main id="player-container"><p class="no-session" role="status">Cargando grabación...</p></main>
  <script src="https://cdn.jsdelivr.net/npm/asciinema-player@3.7.1/dist/bundle/asciinema-player.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token");
    const withToken = (url) => token ? url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token) : url;
    const session = params.get("session") || "/";
    document.getElementById("sessionLabel").textContent = session;
    const castUrl = withToken(`/api/recording?session=${encodeURIComponent(session)}`);
    document.getElementById("downloadBtn").href = castUrl;
    // Only allow same-origin relative paths for the back link.
    document.getElementById("backBtn").href = withToken(session.startsWith("/") && !session.startsWith("//") ? session : "/");

    const container = document.getElementById("player-container");
    const showEmpty = () => {
      container.innerHTML = '<div class="no-session" role="status">No hay grabación disponible para esta sesión.<br>Escribe algo en el terminal para generar una.<br><br>Uso: <code>/replay?session=/1</code></div>';
      document.getElementById("downloadBtn").hidden = true;
    };
    // Fetch first: AsciinemaPlayer loads URLs asynchronously, so a 400/404 would never reach a try/catch.
    fetch(castUrl).then((res) => res.ok ? res.text() : Promise.reject(res.status)).then((data) => {
      if (!data.trim()) return showEmpty();
      container.replaceChildren();
      AsciinemaPlayer.create({ data }, container, {
        theme: "monokai", fit: "width", autoPlay: true, speed: 1, idleTimeLimit: 3, poster: "npt:0:01",
      });
    }).catch(showEmpty);
  </script>
</body>
</html>
