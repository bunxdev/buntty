# Security notes:
# - Ports bind to 127.0.0.1 by default. To reach BunTTY from the LAN set BT_BIND=0.0.0.0
#   AND BT_TOKEN (without a token only loopback/private IPs are accepted).
# - /var/run/docker.sock gives these containers root on the host. Remove it if the
#   agents don't need to drive Docker.
services:
  dev:
    image: debian:bookworm-slim
    container_name: dev
    hostname: dev
    ports:
      - "${BT_BIND:-127.0.0.1}:3000:3000"
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.claude:/root/.claude
    security_opt:
      - no-new-privileges:true
    environment:
      - BT_ALLOWED_HOSTS=host.docker.internal
      - BT_TOKEN=${BT_TOKEN:-}
      - BT_VIEW_TOKEN=${BT_VIEW_TOKEN:-}
    command: ["/bin/bash", "/scripts/main.sh"]
    restart: unless-stopped

  kali:
    image: kalilinux/kali-rolling
    container_name: kali
    hostname: kali
    ports:
      - "${BT_BIND:-127.0.0.1}:3001:3000"
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.claude:/root/.claude
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      - BT_ALLOWED_HOSTS=host.docker.internal
      - BT_TOKEN=${BT_TOKEN:-}
      - BT_VIEW_TOKEN=${BT_VIEW_TOKEN:-}
      # Only the grid on :3000 may frame this shell. Never add '*' (any site could
      # clickjack a root shell). Reaching the grid by LAN IP/name? Override with
      # BT_KALI_FRAME_ANCESTORS="http://<that-host>:3000 ...".
      - BT_FRAME_ANCESTORS=${BT_KALI_FRAME_ANCESTORS:-http://localhost:3000 http://127.0.0.1:3000 http://host.docker.internal:3000}
    command: ["/bin/bash", "/scripts/main.sh"]
    restart: unless-stopped
